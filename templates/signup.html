{% extends "base.html" %}
{% block title %}Sign up — Task Manager{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-brand">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
      </svg>
    </div>
    <div class="auth-header">
      <h1>Create account</h1>
      <p>Start managing your tasks today</p>
    </div>
    <form method="POST" id="signup-form">
      <div class="auth-row">
        <label>
          <span class="auth-label-text">Username</span>
          <input type="text" name="username" id="signup-username" required autofocus autocomplete="username" placeholder="e.g. johndoe">
        </label>
        <label>
          <span class="auth-label-text">Email</span>
          <input type="email" name="email" id="signup-email" required autocomplete="email" placeholder="you@example.com">
        </label>
      </div>
      <label>
        <span class="auth-label-text">Password</span>
        <input type="password" name="password" id="signup-password" required autocomplete="new-password" minlength="6" placeholder="At least 6 characters">
      </label>
      <label>
        <span class="auth-label-text">Confirm Password</span>
        <input type="password" name="confirm_password" id="signup-confirm" required autocomplete="new-password" placeholder="Re-enter password">
      </label>
      <button type="submit" id="signup-submit">
        Create account
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>
    <div class="auth-divider">
      <span>or</span>
    </div>
    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
